            { id: 7, name: "Minimalist Thin", price: "₦13,500", image: "./glassrs-image/gla-020.jpg", rating: 4.5 },

        ];

        // Function to generate star rating HTML
        function generateStarRating(rating) {
            let stars = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            
            return stars;
        }

        // Function to display products
        function displayProducts() {
            const productsGrid = document.getElementById('products-grid');
            productsGrid.innerHTML = '';
            
            // In a real application, you would fetch products from a database
            // For demonstration, we're repeating the sample products to reach 100+
            const totalProducts = 112; // You can adjust this number
            
            for (let i = 0; i < totalProducts; i++) {
                const product = products[i % products.length];
                const productElement = document.createElement('div');
                productElement.className = 'product-card';
                productElement.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-content">
                        <h3 class="product-title">${product.name} ${Math.floor(i / products.length) + 1 > 1 ? (Math.floor(i / products.length) + 1) : ''}</h3>
                        <div class="product-price">${product.price}</div>
                        <div class="product-rating">
                            ${generateStarRating(product.rating)}
                        </div>
                        <div class="product-actions">
                            <button class="btn btn-primary">Add to Cart</button>
                            <button class="btn btn-secondary">Quick View</button>
                        </div>
                    </div>
                `;
                productsGrid.appendChild(productElement);
            }
        }
// Add this JavaScript to make the search functional
document.getElementById('search-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent form from submitting normally
    const searchTerm = document.getElementById('site-search').value;
    
    if (searchTerm.trim()) {
        // In a real implementation, you would search through your products
        // For now, we'll just filter the products grid
        filterProducts(searchTerm);
    }
});

function filterProducts(searchTerm) {
    const products = document.querySelectorAll('.product-card');
    const searchLower = searchTerm.toLowerCase();
    
    products.forEach(product => {
        const title = product.querySelector('.product-title').textContent.toLowerCase();
        if (title.includes(searchLower)) {
            product.style.display = 'block';
        } else {
            product.style.display = 'none';
        }
    });
}
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            displayProducts();
            
            // Mobile menu toggle
            document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
                const navLinks = document.querySelector('.nav-links');
                navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
            });
        });
    </script>
